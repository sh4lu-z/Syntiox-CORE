name: Build Syntiox CORE Micro-Exe

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install Build Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Prepare License
      run: Copy-Item LICENSE LICENSE.txt

    - name: Build Tiny Executable
      run: |
        python build_exe.py
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Syntiox_CORE_Exe
        path: dist/Syntiox_CORE.exe
